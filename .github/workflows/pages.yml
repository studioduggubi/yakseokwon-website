name: Deploy Yakseokwon to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      # Repository variable selects preview or official-domain output.
      SITE_PROFILE: ${{ vars.PAGES_DEPLOY_PROFILE || 'preview' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependency
        run: python -m pip install -r requirements.txt
      - name: Check analytics privacy boundaries
        run: node scripts/check_analytics.cjs
      - name: Prepare and verify official-domain package
        env:
          SITE_PROFILE: production
          SITE_OUTPUT_DIR: dist-production
        run: |
          python scripts/build.py
          python scripts/verify.py
      - name: Save official-domain package for review
        uses: actions/upload-artifact@v4
        with:
          name: yakseokwon-production-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist-production
          retention-days: 14
      - name: Build selected deployment
        run: python scripts/build.py
      - name: Check routes, assets and search exclusion
        run: python scripts/verify.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          timeout: 1200000
